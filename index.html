<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#15151f">
<title>Family Calendar</title>
<style>
  :root{
    --bg:#14141d;
    --panel:#1d1d29;
    --panel2:#262633;
    --entry:#363649;
    --weekend:#221d2b;
    --line:#34343f;
    --ink:#ecebf2;
    --mut:#8a8a9c;
    --accent:#f5a623;
    --home:#3ec97a;
    --office:#4f8ff7;
    --off:#6b6b7e;
    --m:#e0608a;
    --k:#56b6c2;
    --both:#f5a623;
    --none:#5a5a68;
    --danger:#e05a5a;
    /* heat scale */
    --heat0:#3a3a46;
    --heat1:#3ec97a;
    --heat2:#f2d935;
    --heat3:#f0883e;
    --heat4:#e05a5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;
    overscroll-behavior-y:contain;
  }
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;}
  input{font-family:inherit;}
  .display{font-family:'Bahnschrift','Trebuchet MS',sans-serif;font-weight:700;letter-spacing:.3px;}

  /* ---------- Lock ---------- */
  #lock{position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;}
  #lock h1{font-size:26px;}
  #lock p{color:var(--mut);font-size:14px;}
  .pin-dots{display:flex;gap:14px;}
  .pin-dot{width:14px;height:14px;border:2px solid var(--line);transition:.15s;}
  .pin-dot.on{background:var(--accent);border-color:var(--accent);}
  .pad{display:grid;grid-template-columns:repeat(3,70px);gap:13px;}
  .pad button{height:70px;background:var(--panel2);font-size:24px;font-weight:600;border:1px solid var(--line);transition:.1s;}
  .pad button:active{background:var(--accent);color:#15151f;}
  .pad .blank{background:none;border:none;pointer-events:none;}
  #lock.err .pin-dot{border-color:var(--danger);animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .screen{display:none;max-width:560px;margin:0 auto;}
  .screen.active{display:block;}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;border-bottom:1px solid var(--line);}
  .topbar .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .arrow{width:40px;height:40px;background:var(--panel2);font-size:22px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;}
  .arrow:active{background:var(--accent);color:#15151f;}
  .ttl{flex:1;text-align:center;}
  .ttl .big{font-size:18px;}
  .ttl .sub{color:var(--mut);font-size:12px;margin-top:1px;}
  .ttlbtn{background:var(--panel2);border:1px solid var(--line);padding:6px 10px;}
  .ttlbtn:active{border-color:var(--accent);}
  .ttlbtn .sub{color:var(--accent);font-size:10px;letter-spacing:.3px;}
  .backbtn{display:flex;align-items:center;gap:5px;color:var(--accent);font-size:13px;font-weight:600;
    padding:4px 0;}
  .status{text-align:center;font-size:11px;color:var(--mut);min-height:13px;padding:6px 0 0;}
  .status.saving{color:var(--accent);} .status.err{color:var(--danger);}

  /* ---------- Month screen ---------- */
  #month .body{padding:16px 14px 40px;}
  .wkrow{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);
    padding:15px 15px;margin-bottom:11px;transition:.1s;}
  .wkrow:active{border-color:var(--accent);}
  .wkrow.current{border-color:var(--accent);}
  .wkrow .heat{width:14px;height:42px;flex-shrink:0;background:var(--heat0);}
  .wkrow .info{flex:1;}
  .wkrow .range{font-size:16px;font-weight:700;}
  .wkrow .meta{color:var(--mut);font-size:12px;margin-top:2px;}
  .wkrow .cnt{font-size:13px;color:var(--mut);text-align:right;line-height:1.3;}
  .wkrow .cnt b{display:block;font-size:22px;color:var(--ink);}
  .wkrow .chev{color:var(--mut);font-size:22px;}

  /* ---------- Week screen ---------- */
  #week .body{padding:12px 14px 50px;}
  /* heat strip */
  .strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px;}
  .strip .cell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 6px;
    background:var(--panel);border:1px solid var(--line);}
  .strip .cell.today{border-color:var(--accent);}
  .strip .cell.wknd{background:var(--weekend);}
  .strip .cell .dl{font-size:12px;font-weight:700;}
  .strip .cell .dot{width:16px;height:16px;border-radius:50%;background:var(--heat0);}

  /* day card */
  .card{background:var(--panel);border:1px solid var(--line);padding:13px;display:flex;flex-direction:column;gap:13px;margin-top:14px;}
  .card.wknd{background:var(--weekend);}
  .card.istoday{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .cardhdr{text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:-2px;}
  .cardhdr .dn{font-size:16px;font-weight:700;}
  .cardhdr .dd{color:var(--mut);font-size:12px;margin-top:1px;}
  .lbl{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:6px;}

  /* location */
  .loc-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .loc-grp{display:flex;align-items:center;gap:6px;}
  .loc-grp .who{font-size:12px;color:var(--mut);font-weight:700;}
  .loc-btn{width:62px;padding:5px 4px;text-align:center;background:var(--panel2);border:1px solid var(--line);transition:.1s;}
  .loc-btn .val{font-weight:700;font-size:12px;}
  .loc-btn:active{transform:scale(.94);}
  .loc-btn[data-state="Home"]{border-color:var(--home);} .loc-btn[data-state="Home"] .val{color:var(--home);}
  .loc-btn[data-state="Office"]{border-color:var(--office);} .loc-btn[data-state="Office"] .val{color:var(--office);}
  .loc-btn[data-state="Off"]{border-color:var(--off);} .loc-btn[data-state="Off"] .val{color:var(--off);}
  .loc-btn.carbtn{width:72px;}
  .loc-btn.carbtn[data-state="Together"]{border-color:var(--both);} .loc-btn.carbtn[data-state="Together"] .val{color:var(--both);}
  .loc-btn.carbtn[data-state="M"]{border-color:var(--m);} .loc-btn.carbtn[data-state="M"] .val{color:var(--m);}
  .loc-btn.carbtn[data-state="K"]{border-color:var(--k);} .loc-btn.carbtn[data-state="K"] .val{color:var(--k);}
  .bankhol{text-align:center;font-size:13px;font-weight:700;color:var(--accent);padding:4px 0;letter-spacing:.5px;}

  /* tasks */
  .task{display:flex;align-items:center;gap:9px;background:var(--entry);border:1px solid var(--line);
    padding:7px 9px;margin-bottom:6px;}
  .task .time{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;min-width:42px;}
  .task .time.anytime{color:var(--mut);font-weight:600;font-size:11px;}
  .task .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .task .editzone{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .gcal{font-size:13px;line-height:1;padding:4px 6px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;flex-shrink:0;}
  .assign{font-size:11px;font-weight:800;min-width:34px;text-align:center;padding:3px 0;border:1px solid var(--line);}
  .assign[data-a="M"]{background:var(--m);color:#15151f;border-color:var(--m);}
  .assign[data-a="K"]{background:var(--k);color:#15151f;border-color:var(--k);}
  .assign[data-a="Both"]{background:var(--both);color:#15151f;border-color:var(--both);}
  .assign[data-a="-"]{background:var(--panel);color:var(--mut);}
  .assign:active{transform:scale(.94);}
  .add-task{width:100%;border:1px dashed var(--line);color:var(--mut);padding:8px;font-size:12px;font-weight:600;}
  .add-task:active{border-color:var(--accent);color:var(--accent);}

  /* shared inline add row (tasks-style look) */
  .add-row{display:flex;gap:8px;margin-top:2px;}
  .add-row input{flex:1;background:var(--entry);border:1px dashed var(--line);padding:8px 10px;color:var(--ink);font-size:13px;min-width:0;}
  .add-row input:focus{outline:none;border-color:var(--accent);border-style:solid;}
  .add-row input::placeholder{color:var(--mut);}

  /* supper (list like tasks) */
  .sup{display:flex;align-items:center;gap:9px;background:var(--entry);border:1px solid var(--line);
    padding:7px 9px;margin-bottom:6px;}
  .sup .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:2px 0;}

  /* todo */
  .todo-card{background:var(--panel);border:1px solid var(--line);padding:13px;margin-top:16px;}
  .todo-card h2{font-size:16px;margin-bottom:11px;}
  .todo{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);}
  .todo:last-of-type{border-bottom:none;}
  .check{width:22px;height:22px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:14px;transition:.1s;}
  .check.done{background:var(--home);border-color:var(--home);color:#15151f;}
  .todo .txt{flex:1;font-size:13px;padding:4px 0;}
  .todo.done .txt{text-decoration:line-through;color:var(--mut);}
  .todo .push{font-size:10px;font-weight:700;color:var(--mut);border:1px solid var(--line);padding:4px 7px;letter-spacing:.5px;}
  .todo .push:active{border-color:var(--accent);color:var(--accent);}
  .todo-add{margin-top:11px;}

  /* modal */
  .modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel);width:100%;max-width:560px;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
    border-top:1px solid var(--line);}
  .modal h3{font-size:18px;margin-bottom:16px;}
  .modal label{font-size:12px;color:var(--mut);display:block;margin-bottom:6px;font-weight:600;}
  .modal input[type=time],.modal input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);
    padding:12px;color:var(--ink);font-size:16px;margin-bottom:14px;}
  .modal input:focus{outline:none;border-color:var(--accent);}
  .timetoggle{display:flex;gap:8px;margin-bottom:14px;}
  .timetoggle button{flex:1;padding:9px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:600;color:var(--mut);}
  .timetoggle button.on{border-color:var(--accent);color:var(--accent);}
  .modal-actions{display:flex;gap:10px;margin-top:4px;}
  .modal-actions button{flex:1;padding:13px;font-weight:700;font-size:14px;}
  .modal-actions .del{background:var(--panel2);border:1px solid var(--danger);color:var(--danger);flex:0 0 auto;padding:13px 16px;}
  .modal-actions .cancel{background:var(--panel2);border:1px solid var(--line);}
  .modal-actions .ok{background:var(--accent);color:#15151f;}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock">
  <h1 class="display">Family Calendar</h1>
  <p>Enter PIN</p>
  <div class="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
  <div class="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="blank"></button><button data-k="0">0</button><button data-k="del">⌫</button>
  </div>
</div>

<!-- MONTH SCREEN -->
<div id="month" class="screen">
  <div class="topbar">
    <div class="nav">
      <button class="arrow" id="prevMo">‹</button>
      <div class="ttl"><div class="big display" id="moTitle">—</div><div class="sub">tap a week to open</div></div>
      <button class="arrow" id="nextMo">›</button>
    </div>
    <div class="status" id="moStatus"></div>
  </div>
  <div class="body" id="moBody"></div>
</div>

<!-- WEEK SCREEN -->
<div id="week" class="screen">
  <div class="topbar">
    <div class="nav">
      <button class="arrow" id="prevWk">‹</button>
      <button class="ttl ttlbtn" id="wkTitleBtn"><div class="big display" id="wkTitle">—</div><div class="sub">tap for month ▾</div></button>
      <button class="arrow" id="nextWk">›</button>
    </div>
    <div class="status" id="wkStatus"></div>
  </div>
  <div class="body">
    <div class="strip" id="strip"></div>
    <div class="todo-card">
      <h2 class="display">To-Do</h2>
      <div id="todoList"></div>
      <div class="todo-add add-row">
        <input type="text" id="todoInput" placeholder="new" enterkeyhint="done">
      </div>
    </div>
    <div id="days"></div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal-bg" id="taskModal">
  <div class="modal">
    <h3 class="display" id="taskModalTitle">New task</h3>
    <div class="timetoggle">
      <button id="ttAnytime">Anytime</button>
      <button id="ttTimed">At a time</button>
    </div>
    <div id="timeWrap" style="display:none;">
      <label>Time</label>
      <input type="time" id="tTime">
    </div>
    <label>What</label>
    <input type="text" id="tName" placeholder="e.g. Dentist" enterkeyhint="done">
    <div class="modal-actions">
      <button class="del" id="tDel" style="display:none;">Delete</button>
      <button class="cancel" id="tCancel">Cancel</button>
      <button class="ok" id="tOk">Save</button>
    </div>
  </div>
</div>

<!-- TODO MODAL -->
<div class="modal-bg" id="todoModal">
  <div class="modal">
    <h3 class="display">Edit task</h3>
    <label>Text</label>
    <input type="text" id="tdName" placeholder="Task…" enterkeyhint="done">
    <div class="modal-actions">
      <button class="del" id="tdDel">Delete</button>
      <button class="cancel" id="tdCancel">Cancel</button>
      <button class="ok" id="tdOk">Save</button>
    </div>
  </div>
</div>

<!-- SUPPER MODAL -->
<div class="modal-bg" id="supperModal">
  <div class="modal">
    <h3 class="display">Edit supper</h3>
    <label>Meal</label>
    <input type="text" id="spName" placeholder="e.g. Pizza" enterkeyhint="done">
    <div class="modal-actions">
      <button class="del" id="spDel">Delete</button>
      <button class="cancel" id="spCancel">Cancel</button>
      <button class="ok" id="spOk">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

// ====== FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyD1b28sgjy-B6_OXDXexiFKy8UftaJ8Lgg",
  authDomain: "family-calendar-81d98.firebaseapp.com",
  databaseURL: "https://family-calendar-81d98-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "family-calendar-81d98",
  storageBucket: "family-calendar-81d98.firebasestorage.app",
  messagingSenderId: "764349590269",
  appId: "1:764349590269:web:933c2c9bdcaf76f451ec94"
};
const FAMILY_ID = "family1";
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);
const authReady = signInAnonymously(auth);

function weekRef(key){ return ref(db, `families/${FAMILY_ID}/weeks/${key}`); }
function summaryRef(key){ return ref(db, `families/${FAMILY_ID}/summary/${key}`); }
async function dbGetWeek(key){
  await authReady;
  const snap = await get(weekRef(key));
  return normalizeWeek(snap.exists() ? snap.val() : null);
}
async function dbSetWeek(key, data){
  await authReady;
  await set(weekRef(key), data);
  await set(summaryRef(key), data.days.reduce((sum,d)=>sum+d.tasks.length,0));
}

// ====== CONFIG ======
const PIN = "0000";
const PEOPLE = { p1:"M", p2:"K" };
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAYL = ["M","T","W","T","F","S","S"];
const LOC_CYCLE = ["Home","Office","Off"];
const ASSIGN_CYCLE = ["-","M","K","Both"];
const CAR_CYCLE = ["Together","M","K"];

// ====== STATE ======
let weekOffset = 0;
let currentKey = "";
let weekData = null;
let weekUnsub = null;
let saveTimer = null;
let lastRefresh = Date.now();
let monthCursor = startOfMonth(new Date());   // first day of displayed month
let editingTask = null;  // {dayIndex, taskIndex|null}
let editingTodo = null;  // index|null
let modalTimed = false;

// ====== DATE HELPERS ======
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function mondayOfDate(d){ const x=new Date(d); x.setHours(0,0,0,0); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
function mondayOf(offset){ const m=mondayOfDate(new Date()); m.setDate(m.getDate()+offset*7); return m; }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDM(d){ return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function offsetOfKey(key){ const target=new Date(key+"T00:00:00"); const base=mondayOf(0); return Math.round((target-base)/(7*864e5)); }

// ====== AUSTRIAN NATIONAL HOLIDAYS ======
// Easter Sunday via Anonymous Gregorian algorithm; movable feasts are offsets from it.
function easterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
const holidayCache={};
function holidaysFor(year){
  if(holidayCache[year]) return holidayCache[year];
  const set={};
  const add=(mo,da,name)=>{ set[year+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0")]=name; };
  const addDate=(dt,name)=>{ set[ymd(dt)]=name; };
  // fixed-date national holidays
  add(1,1,"New Year");
  add(1,6,"Epiphany");
  add(5,1,"Labour Day");
  add(8,15,"Assumption");
  add(10,26,"National Day");
  add(11,1,"All Saints");
  add(12,8,"Immaculate Conception");
  add(12,25,"Christmas Day");
  add(12,26,"St Stephen's Day");
  // movable feasts off Easter
  const es=easterSunday(year);
  const off=(n)=>{ const d=new Date(es); d.setDate(d.getDate()+n); return d; };
  addDate(off(1),"Easter Monday");
  addDate(off(39),"Ascension");
  addDate(off(50),"Whit Monday");
  addDate(off(60),"Corpus Christi");
  holidayCache[year]=set;
  return set;
}
function holidayName(d){ return holidaysFor(d.getFullYear())[ymd(d)] || null; }

function emptyWeek(){
  return { days: DAYS.map(()=>({ loc:{p1:"Home",p2:"Home"}, car:"Together", tasks:[], supper:[] })), todos:[] };
}
// upgrade old data shape (meetings->tasks, dinner/old-supper -> supper list) safely
function normalizeWeek(w){
  if(!w || !w.days || w.days.length!==7) return emptyWeek();
  w.days.forEach(d=>{
    if(!d.tasks){ d.tasks = (d.meetings||[]).map(m=>({time:m.time||"",name:m.name||"",assign:mapFlag(m.flag)})); }
    d.tasks.forEach(t=>{ if(t.assign===undefined) t.assign="-"; if(t.time===undefined) t.time=""; });
    // supper: new shape is an array. Migrate old {p1,p2} object or old dinner object.
    if(!Array.isArray(d.supper)){
      const old = d.supper || d.dinner || {p1:"",p2:""};
      const list = [];
      if(old.p1 && old.p1.trim()) list.push({name:old.p1.trim(),assign:"M"});
      if(old.p2 && old.p2.trim()) list.push({name:old.p2.trim(),assign:"K"});
      d.supper = list;
    }
    d.supper.forEach(s=>{ if(s.assign===undefined) s.assign="Both"; });
    if(!d.loc) d.loc={p1:"Home",p2:"Home"};
    if(d.car===undefined) d.car="Together";
  });
  if(!w.todos) w.todos=[];
  w.todos.forEach(t=>{ if(t.assign===undefined) t.assign="-"; });
  return w;
}
function mapFlag(f){ if(f==="MK") return "Both"; if(f==="M"||f==="K") return f; return "-"; }
function heatClass(n){ if(n===0) return "var(--heat0)"; if(n<=2) return "var(--heat1)"; if(n<=4) return "var(--heat2)"; if(n<=6) return "var(--heat3)"; return "var(--heat4)"; }

// ====== LOCK ======
let pinEntry="";
const lock=document.getElementById("lock");
const dots=lock.querySelectorAll(".pin-dot");
function renderDots(){ dots.forEach((d,i)=>d.classList.toggle("on",i<pinEntry.length)); }
lock.querySelector(".pad").addEventListener("click",e=>{
  const k=e.target.getAttribute("data-k"); if(!k) return;
  if(k==="del"){ pinEntry=pinEntry.slice(0,-1); renderDots(); return; }
  if(pinEntry.length>=4) return;
  pinEntry+=k; renderDots();
  if(pinEntry.length===4){
    if(pinEntry===PIN){ setTimeout(()=>{ lock.style.display="none"; openMonth(); },150); }
    else { lock.classList.add("err"); setTimeout(()=>{ lock.classList.remove("err"); pinEntry=""; renderDots(); },400); }
  }
});

// ====== SCREEN SWITCH ======
function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); document.getElementById(id).classList.add("active"); window.scrollTo(0,0); }
function setStatus(el,txt,cls){ el.textContent=txt; el.className="status"+(cls?" "+cls:""); }

// ====== MONTH SCREEN ======
const moStatus=document.getElementById("moStatus");
async function openMonth(){
  unsubscribeWeek();
  show("month");
  renderMonthShell();
  await loadMonthCounts();
}
function renderMonthShell(){
  document.getElementById("moTitle").textContent = monthCursor.toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const body=document.getElementById("moBody"); body.innerHTML="";
  const weeks=weeksInMonth(monthCursor);
  const curKey=ymd(mondayOf(0));
  weeks.forEach(mon=>{
    const sun=new Date(mon); sun.setDate(sun.getDate()+6);
    const key=ymd(mon);
    const row=document.createElement("div");
    row.className="wkrow"+(key===curKey?" current":"");
    row.dataset.key=key;
    row.innerHTML=`
      <div class="heat" data-heat="${key}"></div>
      <div class="info">
        <div class="range">${fmtDM(mon)} – ${fmtDM(sun)}</div>
        <div class="meta">${key===curKey?"this week":""}</div>
      </div>
      <div class="cnt" data-cnt="${key}"><b>·</b>tasks</div>
      <div class="chev">›</div>`;
    row.onclick=()=>{ weekOffset=offsetOfKey(key); openWeek(); };
    body.appendChild(row);
  });
}
function weeksInMonth(monthStart){
  const first=mondayOfDate(monthStart);
  const monthEnd=new Date(monthStart.getFullYear(),monthStart.getMonth()+1,0);
  const weeks=[]; let cur=new Date(first);
  while(cur<=monthEnd){ weeks.push(new Date(cur)); cur.setDate(cur.getDate()+7); }
  return weeks;
}
async function loadMonthCounts(){
  setStatus(moStatus,"loading…","saving");
  const weeks=weeksInMonth(monthCursor).map(ymd);
  try{
    await authReady;
    const snap=await get(ref(db,`families/${FAMILY_ID}/summary`));
    const counts=snap.exists()?snap.val():{};
    weeks.forEach(k=>{
      const n=counts[k]||0;
      const heatEl=document.querySelector('[data-heat="'+k+'"]');
      const cntEl=document.querySelector('[data-cnt="'+k+'"]');
      if(heatEl) heatEl.style.background=heatClass(n);
      if(cntEl) cntEl.querySelector("b").textContent=n;
    });
    setStatus(moStatus,"","");
  }catch(err){ setStatus(moStatus,"couldn't load counts","err"); }
}
document.getElementById("prevMo").onclick=()=>{ monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1); openMonth(); };
document.getElementById("nextMo").onclick=()=>{ monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1); openMonth(); };

// ====== WEEK SCREEN ======
const wkStatus=document.getElementById("wkStatus");
function openWeek(){ show("week"); currentKey=ymd(mondayOf(weekOffset)); subscribeWeek(); }
document.getElementById("wkTitleBtn").onclick=()=>{ monthCursor=startOfMonth(new Date(currentKey+"T00:00:00")); openMonth(); };
document.getElementById("prevWk").onclick=()=>{ weekOffset--; openWeek(); };
document.getElementById("nextWk").onclick=()=>{ weekOffset++; openWeek(); };

function unsubscribeWeek(){ if(weekUnsub){ weekUnsub(); weekUnsub=null; } }
async function subscribeWeek(){
  unsubscribeWeek();
  setStatus(wkStatus,"loading…","saving");
  const key=currentKey;
  try{
    await authReady;
    if(key!==currentKey) return; // navigated away while waiting on auth
    weekUnsub = onValue(weekRef(key), snap=>{
      weekData = normalizeWeek(snap.exists() ? snap.val() : null);
      renderWeek(); setStatus(wkStatus,"up to date","");
    }, ()=>{ setStatus(wkStatus,"couldn't load — check connection","err"); if(!weekData){ weekData=emptyWeek(); renderWeek(); } });
  }catch(err){ setStatus(wkStatus,"couldn't load — check connection","err"); if(!weekData){ weekData=emptyWeek(); renderWeek(); } }
}
async function saveWeek(){
  setStatus(wkStatus,"saving…","saving");
  try{
    await dbSetWeek(currentKey, weekData);
    setStatus(wkStatus,"saved ✓","");
  }catch(err){ setStatus(wkStatus,"save failed — reopen & retry","err"); }
}
function queueSave(){ clearTimeout(saveTimer); setStatus(wkStatus,"saving…","saving"); saveTimer=setTimeout(saveWeek,700); }

function renderWeek(){
  const mon=mondayOf(weekOffset); const sun=new Date(mon); sun.setDate(sun.getDate()+6);
  document.getElementById("wkTitle").textContent=fmtDM(mon)+" – "+fmtDM(sun);
  renderStrip(); renderDays(); renderTodos();
}
function renderStrip(){
  const strip=document.getElementById("strip"); strip.innerHTML="";
  const todayKey=ymd(new Date());
  weekData.days.forEach((day,i)=>{
    const dd=new Date(mondayOf(weekOffset)); dd.setDate(dd.getDate()+i);
    const hol=holidayName(dd);
    const n=day.tasks.length, off=(i>=5||hol), isToday=ymd(dd)===todayKey;
    const cell=document.createElement("div");
    cell.className="cell"+(isToday?" today":"")+(off?" wknd":"");
    cell.innerHTML=`<div class="dl">${DAYL[i]}</div><div class="dot" style="background:${heatClass(n)}"></div>`;
    strip.appendChild(cell);
  });
}
function renderDays(){
  const wrap=document.getElementById("days"); wrap.innerHTML="";
  const todayKey=ymd(new Date());
  weekData.days.forEach((day,i)=>{
    const dd=new Date(mondayOf(weekOffset)); dd.setDate(dd.getDate()+i);
    const isToday=ymd(dd)===todayKey, wknd=i>=5, hol=holidayName(dd), off=(wknd||hol);

    const card=document.createElement("div");
    card.id="card-"+i;
    card.className="card"+(off?" wknd":"")+(isToday?" istoday":"");

    let html=`<div class="cardhdr"><span class="dn">${DAYS[i]}</span><div class="dd">${fmtDM(dd)}${hol?' · '+escapeHtml(hol):''}</div></div>`;
    if(hol){
      html+=`<div class="bankhol">Bank Holiday</div>`;
    } else if(!wknd){
      html+=`<div class="loc-row">
        <div class="loc-grp"><span class="who">${PEOPLE.p1}</span><button class="loc-btn" data-day="${i}" data-p="p1" data-state="${day.loc.p1}"><div class="val">${day.loc.p1}</div></button></div>
        <div class="loc-grp"><span class="who">${PEOPLE.p2}</span><button class="loc-btn" data-day="${i}" data-p="p2" data-state="${day.loc.p2}"><div class="val">${day.loc.p2}</div></button></div>
        <div class="loc-grp car"><span class="who">🚗</span><button class="loc-btn carbtn" data-car="${i}" data-state="${day.car}"><div class="val">${day.car}</div></button></div>
      </div>`;
    }
    // tasks: anytime first, then timed sorted
    const ordered=orderedTasks(day.tasks);
    html+=`<div>`;
    ordered.forEach(({t,idx})=>{
      const timeHtml = t.time ? `<span class="time">${t.time}</span>` : `<span class="time anytime">any</span>`;
      html+=`<div class="task">
        <div class="editzone" data-edit="${i}-${idx}">${timeHtml}<span class="nm">${escapeHtml(t.name)}</span></div>
        <button class="gcal" data-gcal="${i}-${idx}">📅</button>
        <button class="assign" data-assign="${i}-${idx}" data-a="${t.assign}">${t.assign==="Both"?"Both":t.assign}</button>
      </div>`;
    });
    html+=`<button class="add-task" data-add="${i}">new</button></div>`;
    // supper: list of meals, each with cycle assignment; inline add row
    html+=`<div><div class="lbl">Supper</div>`;
    day.supper.forEach((s,si)=>{
      html+=`<div class="sup">
        <span class="nm" data-supedit="${i}-${si}">${escapeHtml(s.name)}</span>
        <button class="assign" data-supassign="${i}-${si}" data-a="${s.assign}">${s.assign==="Both"?"Both":s.assign}</button>
      </div>`;
    });
    html+=`<div class="add-row"><input type="text" data-supadd="${i}" placeholder="new" enterkeyhint="done"></div></div>`;

    card.innerHTML=html;
    wrap.appendChild(card);
  });
  bindWeek();
}
function orderedTasks(tasks){
  const idx=tasks.map((t,i)=>({t,idx:i}));
  const any=idx.filter(o=>!o.t.time);
  const timed=idx.filter(o=>o.t.time).sort((a,b)=>a.t.time.localeCompare(b.t.time));
  return any.concat(timed);
}
function renderTodos(){
  const list=document.getElementById("todoList"); list.innerHTML="";
  weekData.todos.forEach((t,i)=>{
    const row=document.createElement("div"); row.className="todo"+(t.done?" done":"");
    row.innerHTML=`
      <div class="check ${t.done?'done':''}" data-tcheck="${i}">${t.done?'✓':''}</div>
      <span class="txt" data-tedit="${i}">${escapeHtml(t.text)}</span>
      <button class="assign" data-tassign="${i}" data-a="${t.assign}">${t.assign==="Both"?"Both":t.assign}</button>
      <button class="push" data-tpush="${i}">Push</button>`;
    list.appendChild(row);
  });
  bindTodos();
}

// ====== BINDINGS ======
function bindWeek(){
  document.querySelectorAll(".loc-btn").forEach(b=>b.onclick=()=>{
    const di=+b.dataset.day,p=b.dataset.p,cur=weekData.days[di].loc[p];
    const nx=LOC_CYCLE[(LOC_CYCLE.indexOf(cur)+1)%3];
    weekData.days[di].loc[p]=nx; b.dataset.state=nx; b.querySelector(".val").textContent=nx; queueSave();
  });
  document.querySelectorAll("[data-car]").forEach(b=>b.onclick=()=>{
    const di=+b.dataset.car,cur=weekData.days[di].car;
    const nx=CAR_CYCLE[(CAR_CYCLE.indexOf(cur)+1)%3];
    weekData.days[di].car=nx; b.dataset.state=nx; b.querySelector(".val").textContent=nx; queueSave();
  });
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openTaskModal(+b.dataset.add,null));
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{ const [d,t]=b.dataset.edit.split("-").map(Number); openTaskModal(d,t); });
  document.querySelectorAll("[data-gcal]").forEach(b=>b.onclick=()=>{
    const [d,t]=b.dataset.gcal.split("-").map(Number);
    const task=weekData.days[d].tasks[t];
    const dd=new Date(mondayOf(weekOffset)); dd.setDate(dd.getDate()+d);
    const p2=n=>String(n).padStart(2,"0");
    const day=`${dd.getFullYear()}${p2(dd.getMonth()+1)}${p2(dd.getDate())}`;
    let dates;
    if(task.time && /^\d{1,2}:\d{2}$/.test(task.time)){
      const [hh,mm]=task.time.split(":").map(Number);
      const s=new Date(dd); s.setHours(hh,mm,0,0);
      const e=new Date(s); e.setHours(e.getHours()+1);
      const f=x=>`${x.getFullYear()}${p2(x.getMonth()+1)}${p2(x.getDate())}T${p2(x.getHours())}${p2(x.getMinutes())}00`;
      dates=`${f(s)}/${f(e)}`;
    } else {
      const nx=new Date(dd); nx.setDate(nx.getDate()+1);
      dates=`${day}/${nx.getFullYear()}${p2(nx.getMonth()+1)}${p2(nx.getDate())}`;
    }
    const url="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(task.name)+"&dates="+dates;
    window.open(url,"_blank");
  });
  document.querySelectorAll("[data-assign]").forEach(b=>b.onclick=()=>{
    const [d,t]=b.dataset.assign.split("-").map(Number);
    const cur=weekData.days[d].tasks[t].assign;
    const nx=ASSIGN_CYCLE[(ASSIGN_CYCLE.indexOf(cur)+1)%4];
    weekData.days[d].tasks[t].assign=nx; b.dataset.a=nx; b.textContent=nx; renderStrip(); queueSave();
  });
  // supper: inline add
  document.querySelectorAll("[data-supadd]").forEach(inp=>{
    inp.addEventListener("keydown",e=>{
      if(e.key!=="Enter") return;
      const v=inp.value.trim(); if(!v) return;
      weekData.days[+inp.dataset.supadd].supper.push({name:v,assign:"Both"});
      renderDays(); queueSave();
      // keep focus flow natural; re-render rebuilds inputs so just save
    });
  });
  // supper: cycle assignment
  document.querySelectorAll("[data-supassign]").forEach(b=>b.onclick=()=>{
    const [d,s]=b.dataset.supassign.split("-").map(Number);
    const cur=weekData.days[d].supper[s].assign;
    const nx=ASSIGN_CYCLE[(ASSIGN_CYCLE.indexOf(cur)+1)%4];
    weekData.days[d].supper[s].assign=nx; b.dataset.a=nx; b.textContent=nx; queueSave();
  });
  // supper: tap name to edit/delete
  document.querySelectorAll("[data-supedit]").forEach(el=>el.onclick=()=>{
    const [d,s]=el.dataset.supedit.split("-").map(Number);
    openSupperModal(d,s);
  });
}
function bindTodos(){
  document.querySelectorAll("[data-tcheck]").forEach(c=>c.onclick=()=>{ const i=+c.dataset.tcheck; weekData.todos[i].done=!weekData.todos[i].done; renderTodos(); queueSave(); });
  document.querySelectorAll("[data-tassign]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.tassign,cur=weekData.todos[i].assign;
    const nx=ASSIGN_CYCLE[(ASSIGN_CYCLE.indexOf(cur)+1)%4];
    weekData.todos[i].assign=nx; b.dataset.a=nx; b.textContent=nx; queueSave();
  });
  document.querySelectorAll("[data-tedit]").forEach(b=>b.onclick=()=>openTodoModal(+b.dataset.tedit));
  document.querySelectorAll("[data-tpush]").forEach(b=>b.onclick=()=>pushTodo(+b.dataset.tpush));
}

// todo add (inline)
document.getElementById("todoInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addTodo(); });
function addTodo(){ const inp=document.getElementById("todoInput"); const v=inp.value.trim(); if(!v) return;
  weekData.todos.push({text:v,done:false,assign:"-"}); inp.value=""; renderTodos(); queueSave(); }

// move a todo to next week's list (true move, lands unticked)
async function pushTodo(i){
  const item=weekData.todos[i];
  if(!confirm('Push "'+item.text+'" to next week?')) return;
  const nextKey=ymd((function(){ const m=mondayOf(weekOffset); m.setDate(m.getDate()+7); return m; })());
  setStatus(wkStatus,"pushing…","saving");
  try{
    const next=await dbGetWeek(nextKey);
    next.todos.push({text:item.text,done:false,assign:item.assign});
    await dbSetWeek(nextKey, next);
    // remove from this week and save
    weekData.todos.splice(i,1);
    renderTodos();
    await saveWeek();
    setStatus(wkStatus,"pushed to next week ✓","");
  }catch(err){
    setStatus(wkStatus,"push failed — try again","err");
    subscribeWeek(); // re-sync so nothing looks half-moved
  }
}

// ====== TASK MODAL ======
const taskModal=document.getElementById("taskModal");
function openTaskModal(dayIndex,taskIndex){
  editingTask={dayIndex,taskIndex};
  const isEdit=taskIndex!==null;
  document.getElementById("taskModalTitle").textContent=isEdit?"Edit task":"New task";
  document.getElementById("tDel").style.display=isEdit?"block":"none";
  let t=isEdit?weekData.days[dayIndex].tasks[taskIndex]:{time:"",name:""};
  modalTimed=!!t.time;
  document.getElementById("tName").value=t.name||"";
  document.getElementById("tTime").value=t.time||"";
  setTimeMode(modalTimed);
  taskModal.classList.add("show");
}
function setTimeMode(timed){ modalTimed=timed;
  document.getElementById("ttAnytime").classList.toggle("on",!timed);
  document.getElementById("ttTimed").classList.toggle("on",timed);
  document.getElementById("timeWrap").style.display=timed?"block":"none";
}
document.getElementById("ttAnytime").onclick=()=>setTimeMode(false);
document.getElementById("ttTimed").onclick=()=>setTimeMode(true);
document.getElementById("tCancel").onclick=()=>taskModal.classList.remove("show");
taskModal.onclick=e=>{ if(e.target===taskModal) taskModal.classList.remove("show"); };
document.getElementById("tDel").onclick=()=>{
  const {dayIndex,taskIndex}=editingTask;
  weekData.days[dayIndex].tasks.splice(taskIndex,1);
  taskModal.classList.remove("show"); renderDays(); renderStrip(); queueSave();
};
document.getElementById("tOk").onclick=()=>{
  const name=document.getElementById("tName").value.trim();
  if(!name){ alert("Please enter what the task is."); return; }
  const time=modalTimed?document.getElementById("tTime").value:"";
  if(modalTimed && !time){ alert("Please pick a time, or choose Anytime."); return; }
  const {dayIndex,taskIndex}=editingTask;
  if(taskIndex===null){ weekData.days[dayIndex].tasks.push({time,name,assign:"-"}); }
  else { const t=weekData.days[dayIndex].tasks[taskIndex]; t.time=time; t.name=name; }
  taskModal.classList.remove("show"); renderDays(); renderStrip(); queueSave();
};

// ====== TODO MODAL ======
const todoModal=document.getElementById("todoModal");
function openTodoModal(i){ editingTodo=i; document.getElementById("tdName").value=weekData.todos[i].text; todoModal.classList.add("show"); }
document.getElementById("tdCancel").onclick=()=>todoModal.classList.remove("show");
todoModal.onclick=e=>{ if(e.target===todoModal) todoModal.classList.remove("show"); };
document.getElementById("tdDel").onclick=()=>{ weekData.todos.splice(editingTodo,1); todoModal.classList.remove("show"); renderTodos(); queueSave(); };
document.getElementById("tdOk").onclick=()=>{ const v=document.getElementById("tdName").value.trim(); if(!v){ alert("Enter text or delete the task."); return; } weekData.todos[editingTodo].text=v; todoModal.classList.remove("show"); renderTodos(); queueSave(); };

// ====== SUPPER MODAL ======
let editingSupper=null; // {d,s}
const supperModal=document.getElementById("supperModal");
function openSupperModal(d,s){ editingSupper={d,s}; document.getElementById("spName").value=weekData.days[d].supper[s].name; supperModal.classList.add("show"); }
document.getElementById("spCancel").onclick=()=>supperModal.classList.remove("show");
supperModal.onclick=e=>{ if(e.target===supperModal) supperModal.classList.remove("show"); };
document.getElementById("spDel").onclick=()=>{ weekData.days[editingSupper.d].supper.splice(editingSupper.s,1); supperModal.classList.remove("show"); renderDays(); queueSave(); };
document.getElementById("spOk").onclick=()=>{ const v=document.getElementById("spName").value.trim(); if(!v){ alert("Enter a meal or delete it."); return; } weekData.days[editingSupper.d].supper[editingSupper.s].name=v; supperModal.classList.remove("show"); renderDays(); queueSave(); };

// ====== AUTO REFRESH ======
// Week screen stays live via the onValue subscription; only the month
// screen's counts need a manual refresh on refocus.
function maybeAutoRefresh(){
  if(Date.now()-lastRefresh<3000) return;
  lastRefresh=Date.now();
  if(document.getElementById("month").classList.contains("active")) loadMonthCounts();
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) maybeAutoRefresh(); });
window.addEventListener("focus",maybeAutoRefresh);

// ====== UTIL ======
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return (s||"").replace(/"/g,'&quot;');}
