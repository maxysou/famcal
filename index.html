<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0b0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Family Calendar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#0a0b0d;
  --panel:#3a3a3a;
  --panel2:#464646;
  --entry:#525252;
  --weekend:#2c2c2c;
  --line:rgba(255,255,255,0.14);
  --line2:rgba(255,255,255,0.2);
  --ink:#edebe4;
  --mut:#9aa0ac;
  --accent:#c6f24e;
  --off:#7e8aa8;
  --both:#f5b54a;
  --none:#3a3f4a;
  --danger:#ff6a55;
  --heat0:#3a3f4a;
  --heat1:#c6f24e;
  --heat2:#f5b54a;
  --heat3:#ff9a4a;
  --heat4:#ff6a55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  overscroll-behavior-y:contain;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;}
input{font-family:inherit;}
.display{font-family:'IBM Plex Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;}

/* ---------- Lock ---------- */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;}
#lock h1{font-size:26px;}
#lock p{color:var(--mut);font-size:14px;}
.pin-dots{display:flex;gap:14px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:.15s;}
.pin-dot.on{background:var(--accent);border-color:var(--accent);}
.pad{display:grid;grid-template-columns:repeat(3,70px);gap:13px;}
.pad button{height:70px;border-radius:12px;background:var(--panel);font-size:24px;font-weight:600;border:1px solid var(--line);transition:.1s;}
.pad button:active{background:var(--accent);color:#0a0b0d;}
.pad .blank{background:none;border:none;pointer-events:none;}
#lock.err .pin-dot{border-color:var(--danger);animation:shake .35s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.screen{display:none;max-width:560px;margin:0 auto;}
.screen.active{display:block;}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;border-bottom:1px solid var(--line);}
.topbar .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.arrow{width:40px;height:40px;border-radius:10px;background:var(--panel);font-size:22px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--mut);}
.arrow:active{background:var(--accent);color:#0a0b0d;}
.ttl{flex:1;text-align:center;}
.ttl .big{font-size:18px;}
.ttl .sub{color:var(--mut);font-size:12px;margin-top:1px;}
.ttlbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;}
.ttlbtn:active{border-color:var(--accent);}
.ttlbtn .sub{color:var(--accent);font-size:10px;letter-spacing:.3px;}
.backbtn{display:flex;align-items:center;gap:5px;color:var(--accent);font-size:13px;font-weight:600;
  padding:4px 0;}
.status{text-align:center;font-size:11px;color:var(--mut);min-height:13px;padding:6px 0 0;}
.status.saving{color:var(--accent);} .status.err{color:var(--danger);}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;color:var(--mut);font-size:13px;padding:7px 12px;}
.ghost:active{color:var(--ink);border-color:var(--line2);}

/* ---------- Month screen ---------- */
#month .body{padding:16px 14px 40px;}
.wkrow{display:flex;align-items:center;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:15px 15px;margin-bottom:11px;transition:.1s;}
.wkrow:active{border-color:var(--accent);}
.wkrow.current{border-color:var(--accent);}
.wkrow .heat{width:14px;height:42px;flex-shrink:0;border-radius:5px;background:var(--heat0);}
.wkrow .info{flex:1;}
.wkrow .range{font-size:16px;font-weight:700;}
.wkrow .meta{color:var(--mut);font-size:12px;margin-top:2px;}
.wkrow .cnt{font-size:13px;color:var(--mut);text-align:right;line-height:1.3;}
.wkrow .cnt b{display:block;font-size:22px;color:var(--ink);}
.wkrow .chev{color:var(--mut);font-size:22px;}

/* ---------- Week screen ---------- */
#week .body{padding:12px 14px 50px;}
/* today summary */
#todaySummary{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;}
.today-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.today-chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);min-width:64px;}
.today-chip .tn{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.today-chip .tv{font-size:13px;font-weight:700;}
.today-chip.home{border-color:var(--line2);background:rgba(255,255,255,.06);}
.today-chip.office{border-color:var(--accent);background:rgba(198,242,78,.14);color:var(--accent);}
.today-chip.off{border-color:var(--off);background:rgba(126,138,168,.16);color:var(--off);}
.today-chip.car{border-color:var(--both);background:rgba(245,181,74,.14);color:var(--both);}
/* heat strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px;}
.strip .cell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 6px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.strip .cell.today{border-color:var(--accent);}
.strip .cell.wknd{background:var(--weekend);}
.strip .cell .dl{font-size:12px;font-weight:700;}
.strip .cell .dot{width:16px;height:16px;border-radius:50%;background:var(--heat0);}

/* day card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:13px;margin-top:14px;box-shadow:0 2px 6px rgba(0,0,0,.45);}
.card.wknd{background:var(--weekend);}
.card.istoday{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.cardhdr{text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:-2px;}
.cardhdr .dn{font-size:16px;font-weight:700;}
.cardhdr .dd{color:var(--mut);font-size:12px;margin-top:1px;}
.lbl{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:6px;}

/* location */
.loc-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.loc-grp{display:flex;align-items:center;gap:6px;}
.loc-grp .who{font-size:12px;color:var(--mut);font-weight:700;}
.loc-btn{width:62px;padding:5px 4px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;transition:.1s;}
.loc-btn .val{font-weight:700;font-size:12px;}
.loc-btn:active{transform:scale(.94);}
.loc-btn[data-state="Home"]{border-color:var(--line2);} .loc-btn[data-state="Home"] .val{color:var(--ink);}
.loc-btn[data-state="Office"]{border-color:var(--accent);background:rgba(198,242,78,.12);} .loc-btn[data-state="Office"] .val{color:var(--accent);}
.loc-btn[data-state="Off"]{border-color:var(--off);background:rgba(126,138,168,.16);} .loc-btn[data-state="Off"] .val{color:var(--off);}
.loc-btn.carbtn{width:72px;}
.loc-btn.carbtn.together{border-color:var(--both);background:rgba(245,181,74,.12);} .loc-btn.carbtn.together .val{color:var(--both);}
.loc-btn.carbtn.person{border-color:var(--accent);background:rgba(198,242,78,.12);} .loc-btn.carbtn.person .val{color:var(--accent);}
.bankhol{text-align:center;font-size:13px;font-weight:700;color:var(--accent);padding:4px 0;letter-spacing:.5px;}

/* tasks */
.task{display:flex;align-items:center;gap:9px;background:var(--entry);border:1px solid var(--line2);border-radius:9px;
  padding:7px 9px;margin-bottom:6px;}
.task .time{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;min-width:42px;}
.task .time.anytime{color:var(--mut);font-weight:600;font-size:11px;}
.task .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.task .editzone{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
.gcal{font-size:13px;line-height:1;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;flex-shrink:0;}
.assign{font-size:11px;font-weight:800;min-width:34px;text-align:center;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--mut);}
.assign.person{font-weight:800;}
.assign.all{background:rgba(245,181,74,.16);color:var(--both);border-color:var(--both);}
.assign:active{transform:scale(.94);}
.add-task{width:100%;border:1px dashed var(--line);border-radius:8px;color:var(--mut);padding:8px;font-size:12px;font-weight:600;}
.add-task:active{border-color:var(--accent);color:var(--accent);}

/* shared inline add row (tasks-style look) */
.add-row{display:flex;gap:8px;margin-top:2px;}
.add-row input{flex:1;background:var(--entry);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:13px;min-width:0;}
.add-row input:focus{outline:none;border-color:var(--accent);border-style:solid;}
.add-row input::placeholder{color:var(--mut);}

/* section list items (supper, breakfast, etc — same look as tasks) */
.sup{display:flex;align-items:center;gap:9px;background:var(--entry);border:1px solid var(--line2);border-radius:9px;
  padding:7px 9px;margin-bottom:6px;}
.sup .nm{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:2px 0;}

/* todo */
.todo-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:16px;}
.todo-card h2{font-size:16px;margin-bottom:11px;}
.todo{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);}
.todo:last-of-type{border-bottom:none;}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:14px;transition:.1s;}
.check.done{background:var(--accent);border-color:var(--accent);color:#0a0b0d;}
.todo .txt{flex:1;font-size:13px;padding:4px 0;}
.todo.done .txt{text-decoration:line-through;color:var(--mut);}
.todo .push{font-size:10px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:4px 7px;letter-spacing:.5px;}
.todo .push:active{border-color:var(--accent);color:var(--accent);}
.todo-add{margin-top:11px;}

/* modal */
.modal-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--panel);width:100%;max-width:560px;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;}
.modal h3{font-size:18px;margin-bottom:16px;}
.modal label{font-size:12px;color:var(--mut);display:block;margin-bottom:6px;font-weight:600;}
.modal input[type=time],.modal input[type=text]{width:100%;background:var(--entry);border:1px solid var(--line2);border-radius:8px;
  padding:12px;color:var(--ink);font-size:16px;margin-bottom:14px;}
.modal input:focus{outline:none;border-color:var(--accent);}
.timetoggle{display:flex;gap:8px;margin-bottom:14px;}
.timetoggle button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:12px;font-weight:600;color:var(--mut);}
.timetoggle button.on{border-color:var(--accent);color:var(--accent);}
.modal-actions{display:flex;gap:10px;margin-top:4px;}
.modal-actions button{flex:1;padding:13px;border-radius:9px;font-weight:700;font-size:14px;}
.modal-actions .del{background:var(--panel2);border:1px solid var(--danger);color:var(--danger);flex:0 0 auto;padding:13px 16px;}
.modal-actions .cancel{background:var(--panel2);border:1px solid var(--line);}
.modal-actions .ok{background:var(--accent);color:#0a0b0d;}

/* settings */
#settings .body{padding:16px 14px 40px;}
.settings-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;}
.settings-panel h2{font-size:16px;margin-bottom:12px;}
.settings-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.settings-row .inp{flex:1;background:var(--entry);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:14px;min-width:0;}
.settings-row .inp:focus{outline:none;border-color:var(--accent);}
.handle-badge{width:36px;height:36px;border-radius:8px;background:rgba(198,242,78,.14);border:1px solid var(--accent);
  color:var(--accent);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.iconb-del{background:none;border:1px solid var(--line);border-radius:8px;color:var(--mut);width:36px;height:36px;font-size:15px;flex-shrink:0;}
.iconb-del:disabled{opacity:.3;}
.iconb-del:active{border-color:var(--danger);color:var(--danger);}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock">
  <h1 class="display">Family Calendar</h1>
  <p>Enter PIN</p>
  <div class="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
  <div class="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="blank"></button><button data-k="0">0</button><button data-k="del">⌫</button>
  </div>
</div>

<!-- MONTH SCREEN -->
<div id="month" class="screen">
  <div class="topbar">
    <div class="nav">
      <button class="arrow" id="prevMo">‹</button>
      <div class="ttl"><div class="big display" id="moTitle">—</div><div class="sub">tap a week to open</div></div>
      <button class="arrow" id="nextMo">›</button>
    </div>
    <div style="text-align:center;margin-top:8px;"><button class="ghost" id="openSettingsBtn">⚙ Settings</button></div>
    <div class="status" id="moStatus"></div>
  </div>
  <div class="body" id="moBody"></div>
</div>

<!-- WEEK SCREEN -->
<div id="week" class="screen">
  <div class="topbar">
    <div class="nav">
      <button class="arrow" id="prevWk">‹</button>
      <button class="ttl ttlbtn" id="wkTitleBtn"><div class="big display" id="wkTitle">—</div><div class="sub">tap for month ▾</div></button>
      <button class="arrow" id="nextWk">›</button>
    </div>
    <div class="status" id="wkStatus"></div>
  </div>
  <div class="body">
    <div id="todaySummary"></div>
    <div class="strip" id="strip"></div>
    <div class="todo-card">
      <h2 class="display">To-Do</h2>
      <div id="todoList"></div>
      <div class="todo-add add-row">
        <input type="text" id="todoInput" placeholder="new" enterkeyhint="done" autocomplete="off">
      </div>
    </div>
    <div id="days"></div>
  </div>
</div>

<!-- SETTINGS SCREEN -->
<div id="settings" class="screen">
  <div class="topbar">
    <button class="backbtn" id="settingsBack">‹ Back to calendar</button>
    <div class="ttl" style="text-align:left;margin-top:8px;"><div class="big display">Settings</div></div>
  </div>
  <div class="body">
    <div class="settings-panel">
      <h2 class="display">People</h2>
      <div id="userList"></div>
      <div class="add-row"><input type="text" id="userAddInput" placeholder="Add person…" enterkeyhint="done" autocomplete="off"></div>
    </div>
    <div class="settings-panel">
      <h2 class="display">Daily sections</h2>
      <div id="sectionList"></div>
      <div class="add-row"><input type="text" id="sectionAddInput" placeholder="Add section (e.g. Breakfast)…" enterkeyhint="done" autocomplete="off"></div>
    </div>
  </div>
</div>

<!-- TASK MODAL -->
<div class="modal-bg" id="taskModal">
  <div class="modal">
    <h3 class="display" id="taskModalTitle">New task</h3>
    <div class="timetoggle">
      <button id="ttAnytime">Anytime</button>
      <button id="ttTimed">At a time</button>
    </div>
    <div id="timeWrap" style="display:none;">
      <label>Time</label>
      <input type="time" id="tTime">
    </div>
    <label>What</label>
    <input type="text" id="tName" placeholder="e.g. Dentist" enterkeyhint="done" autocomplete="off">
    <div class="modal-actions">
      <button class="del" id="tDel" style="display:none;">Delete</button>
      <button class="cancel" id="tCancel">Cancel</button>
      <button class="ok" id="tOk">Save</button>
    </div>
  </div>
</div>

<!-- TODO MODAL -->
<div class="modal-bg" id="todoModal">
  <div class="modal">
    <h3 class="display">Edit task</h3>
    <label>Text</label>
    <input type="text" id="tdName" placeholder="Task…" enterkeyhint="done" autocomplete="off">
    <div class="modal-actions">
      <button class="del" id="tdDel">Delete</button>
      <button class="cancel" id="tdCancel">Cancel</button>
      <button class="ok" id="tdOk">Save</button>
    </div>
  </div>
</div>

<!-- LIST ITEM MODAL (supper / breakfast / any custom section) -->
<div class="modal-bg" id="listModal">
  <div class="modal">
    <h3 class="display" id="listModalTitle">Edit item</h3>
    <label>Name</label>
    <input type="text" id="liName" placeholder="e.g. Pizza" enterkeyhint="done" autocomplete="off">
    <div class="modal-actions">
      <button class="del" id="liDel">Delete</button>
      <button class="cancel" id="liCancel">Cancel</button>
      <button class="ok" id="liOk">Save</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

// ====== FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyD1b28sgjy-B6_OXDXexiFKy8UftaJ8Lgg",
  authDomain: "family-calendar-81d98.firebaseapp.com",
  databaseURL: "https://family-calendar-81d98-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "family-calendar-81d98",
  storageBucket: "family-calendar-81d98.firebasestorage.app",
  messagingSenderId: "764349590269",
  appId: "1:764349590269:web:933c2c9bdcaf76f451ec94"
};
const FAMILY_ID = "family1";
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getDatabase(fbApp);
const authReady = signInAnonymously(auth);

function weekRef(key){ return ref(db, `families/${FAMILY_ID}/weeks/${key}`); }
function summaryRef(key){ return ref(db, `families/${FAMILY_ID}/summary/${key}`); }
function usersRef(){ return ref(db, `families/${FAMILY_ID}/config/users`); }
function sectionsRef(){ return ref(db, `families/${FAMILY_ID}/config/sections`); }
async function dbGetWeek(key){
  await authReady;
  const snap = await get(weekRef(key));
  return normalizeWeek(snap.exists() ? snap.val() : null);
}
async function dbSetWeek(key, data){
  await authReady;
  await set(weekRef(key), data);
  await set(summaryRef(key), data.days.reduce((sum,d)=>sum+d.tasks.length,0));
}

// ====== CONFIG ======
const PIN = "0000";
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAYL = ["M","T","W","T","F","S","S"];
const LOC_CYCLE = ["Home","Office","Off"];

// ====== USERS & SECTIONS (dynamic, live from Firebase) ======
const DEFAULT_USERS = [ {id:"u1",name:"Max"}, {id:"u2",name:"K"} ];
const DEFAULT_SECTIONS = [ {id:"supper",label:"Supper"} ];
let USERS = DEFAULT_USERS.map(u=>({...u}));
let SECTIONS = DEFAULT_SECTIONS.map(s=>({...s}));
let HANDLES = {};

function computeHandles(users){
  const byFirst = {};
  users.forEach(u=>{
    const f = (u.name.trim()[0]||"?").toUpperCase();
    (byFirst[f] = byFirst[f]||[]).push(u);
  });
  const handles = {};
  Object.values(byFirst).forEach(group=>{
    if(group.length===1){ handles[group[0].id] = (group[0].name.trim()[0]||"?").toUpperCase(); return; }
    const used = new Set();
    group.forEach(u=>{
      const name=u.name.trim(), first=(name[0]||"?").toUpperCase(), rest=name.slice(1);
      const consonants=[...rest].filter(c=>/[a-z]/i.test(c) && !"aeiouAEIOU".includes(c));
      const vowels=[...rest].filter(c=>"aeiouAEIOU".includes(c));
      const candidate=[...consonants,...vowels].find(c=>!used.has(c.toLowerCase()));
      if(candidate){ used.add(candidate.toLowerCase()); handles[u.id]=first+candidate.toLowerCase(); }
      else{ let n=2; while(used.has(String(n))) n++; used.add(String(n)); handles[u.id]=first+n; }
    });
  });
  return handles;
}

function cycleNext(arr,cur){ const i=arr.indexOf(cur); return arr[(i<0?0:i+1)%arr.length]; }

// ====== DATE HELPERS ======
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function mondayOfDate(d){ const x=new Date(d); x.setHours(0,0,0,0); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); return x; }
function mondayOf(offset){ const m=mondayOfDate(new Date()); m.setDate(m.getDate()+offset*7); return m; }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDM(d){ return d.toLocaleDateString(undefined,{day:"numeric",month:"short"}); }

// ====== AUSTRIAN NATIONAL HOLIDAYS ======
// Easter Sunday via Anonymous Gregorian algorithm; movable feasts are offsets from it.
function easterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
const holidayCache={};
function holidaysFor(year){
  if(holidayCache[year]) return holidayCache[year];
  const set={};
  const add=(mo,da,name)=>{ set[year+"-"+String(mo).padStart(2,"0")+"-"+String(da).padStart(2,"0")]=name; };
  const addDate=(dt,name)=>{ set[ymd(dt)]=name; };
  // fixed-date national holidays
  add(1,1,"New Year");
  add(1,6,"Epiphany");
  add(5,1,"Labour Day");
  add(8,15,"Assumption");
  add(10,26,"National Day");
  add(11,1,"All Saints");
  add(12,8,"Immaculate Conception");
  add(12,25,"Christmas Day");
  add(12,26,"St Stephen's Day");
  // movable feasts off Easter
  const es=easterSunday(year);
  const off=(n)=>{ const d=new Date(es); d.setDate(d.getDate()+n); return d; };
  addDate(off(1),"Easter Monday");
  addDate(off(39),"Ascension");
  addDate(off(50),"Whit Monday");
  addDate(off(60),"Corpus Christi");
  holidayCache[year]=set;
  return set;
}
function holidayName(d){ return holidaysFor(d.getFullYear())[ymd(d)] || null; }

function emptyDay(){
  const loc={}; USERS.forEach(u=>loc[u.id]="Home");

// legacy value scheme ("p1"/"p2" locations, "M"/"K"/"Both" assignments) -> current user-id scheme
function migrateAssign(a){
  if(a===undefined) return "ALL";
  if(a==="M") return "u1"; if(a==="K") return "u2"; if(a==="Both"||a==="MK") return "ALL";
  return a;
}
function mapFlag(f){ if(f==="MK") return "ALL"; if(f==="M") return "u1"; if(f==="K") return "u2"; return "-"; }
// upgrade old data shapes (fixed p1/p2 people, single "supper" array) to the dynamic shape safely
function normalizeWeek(w){
  if(!w || !w.days || w.days.length!==7) return emptyWeek();
  w.days.forEach(d=>{
    if(!d.tasks){ d.tasks = (d.meetings||[]).map(m=>({time:m.time||"",name:m.name||"",assign:mapFlag(m.flag)})); }
    d.tasks.forEach(t=>{ if(t.time===undefined) t.time=""; t.assign = t.assign===undefined ? "-" : migrateAssign(t.assign); });

    if(!d.loc) d.loc={};
    if(d.loc.p1!==undefined || d.loc.p2!==undefined){
      const nl={};
      if(d.loc.p1!==undefined) nl.u1=d.loc.p1;
      if(d.loc.p2!==undefined) nl.u2=d.loc.p2;
      Object.keys(d.loc).forEach(k=>{ if(k!=="p1"&&k!=="p2") nl[k]=d.loc[k]; });
      d.loc=nl;
    }
    USERS.forEach(u=>{ if(d.loc[u.id]===undefined) d.loc[u.id]="Home"; });

    if(d.car===undefined) d.car="Together";
    else if(d.car==="M") d.car="u1";
    else if(d.car==="K") d.car="u2";

    if(!d.lists) d.lists={};
    if(Array.isArray(d.supper)){ d.lists.supper=d.supper; delete d.supper; }
    else if(d.dinner){
      const old=d.dinner, list=[];
      if(old.p1 && old.p1.trim()) list.push({name:old.p1.trim(),assign:"u1"});
      if(old.p2 && old.p2.trim()) list.push({name:old.p2.trim(),assign:"u2"});
      d.lists.supper=list; delete d.dinner;
    }
    SECTIONS.forEach(s=>{ if(!Array.isArray(d.lists[s.id])) d.lists[s.id]=[]; });
    Object.values(d.lists).forEach(list=>list.forEach(item=>{ item.assign = item.assign===undefined ? "ALL" : migrateAssign(item.assign); }));
  });
  if(!w.todos) w.todos=[];
  w.todos.forEach(t=>{ t.assign = t.assign===undefined ? "-" : migrateAssign(t.assign); });
  return w;
}

  // section items: tap name to edit/delete
  document.querySelectorAll("[data-listedit]").forEach(el=>el.onclick=()=>{
    const [d,sid,idx]=el.dataset.listedit.split("-");
    openListModal(+d,sid,+idx);
  });
}
function bindTodos(){
  document.querySelectorAll("[data-tcheck]").forEach(c=>c.onclick=()=>{ const i=+c.dataset.tcheck; weekData.todos[i].done=!weekData.todos[i].done; renderTodos(); queueSave(); });
  document.querySelectorAll("[data-tassign]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.tassign,cur=weekData.todos[i].assign;
    const nx=cycleNext(assignCycle(),cur);
    weekData.todos[i].assign=nx; b.className=assignClass(nx); b.style.cssText=assignStyle(nx); b.textContent=labelFor(nx); queueSave();
  });
  document.querySelectorAll("[data-tedit]").forEach(b=>b.onclick=()=>openTodoModal(+b.dataset.tedit));
  document.querySelectorAll("[data-tpush]").forEach(b=>b.onclick=()=>pushTodo(+b.dataset.tpush));
}

// todo add (inline)
document.getElementById("todoInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addTodo(); });
function addTodo(){ const inp=document.getElementById("todoInput"); const v=inp.value.trim(); if(!v) return;
  weekData.todos.push({text:v,done:false,assign:"-"}); inp.value=""; renderTodos(); queueSave(); }

// move a todo to next week's list (true move, lands unticked)
async function pushTodo(i){
  const item=weekData.todos[i];
  if(!confirm('Push "'+item.text+'" to next week?')) return;
  const nextKey=ymd((function(){ const m=mondayOf(weekOffset); m.setDate(m.getDate()+7); return m; })());
  setStatus(wkStatus,"pushing…","saving");
  try{
    const next=await dbGetWeek(nextKey);
    next.todos.push({text:item.text,done:false,assign:item.assign});
    await dbSetWeek(nextKey, next);
    // remove from this week and save
    weekData.todos.splice(i,1);
    renderTodos();
    await saveWeek();
    setStatus(wkStatus,"pushed to next week ✓","");
  }catch(err){
    setStatus(wkStatus,"push failed — try again","err");
    subscribeWeek(); // re-sync so nothing looks half-moved
  }
}

// ====== TASK MODAL ======
const taskModal=document.getElementById("taskModal");
function openTaskModal(dayIndex,taskIndex){
  editingTask={dayIndex,taskIndex};
  const isEdit=taskIndex!==null;
  document.getElementById("taskModalTitle").textContent=isEdit?"Edit task":"New task";
  document.getElementById("tDel").style.display=isEdit?"block":"none";
  let t=isEdit?weekData.days[dayIndex].tasks[taskIndex]:{time:"",name:""};
  modalTimed=!!t.time;
  document.getElementById("tName").value=t.name||"";
  document.getElementById("tTime").value=t.time||"";
  setTimeMode(modalTimed);
  taskModal.classList.add("show");
}
function setTimeMode(timed){ modalTimed=timed;
  document.getElementById("ttAnytime").classList.toggle("on",!timed);
  document.getElementById("ttTimed").classList.toggle("on",timed);
  document.getElementById("timeWrap").style.display=timed?"block":"none";
}
document.getElementById("ttAnytime").onclick=()=>setTimeMode(false);
document.getElementById("ttTimed").onclick=()=>setTimeMode(true);
document.getElementById("tCancel").onclick=()=>taskModal.classList.remove("show");
taskModal.onclick=e=>{ if(e.target===taskModal) taskModal.classList.remove("show"); };
document.getElementById("tDel").onclick=()=>{
  const {dayIndex,taskIndex}=editingTask;
  weekData.days[dayIndex].tasks.splice(taskIndex,1);
  taskModal.classList.remove("show"); renderDays(); renderStrip(); queueSave();
};
document.getElementById("tOk").onclick=()=>{
  const name=document.getElementById("tName").value.trim();
  if(!name){ alert("Please enter what the task is."); return; }
  const time=modalTimed?document.getElementById("tTime").value:"";
  if(modalTimed && !time){ alert("Please pick a time, or choose Anytime."); return; }
  const {dayIndex,taskIndex}=editingTask;
  if(taskIndex===null){ weekData.days[dayIndex].tasks.push({time,name,assign:"-"}); }
  else { const t=weekData.days[dayIndex].tasks[taskIndex]; t.time=time; t.name=name; }
  taskModal.classList.remove("show"); renderDays(); renderStrip(); queueSave();
};

// ====== TODO MODAL ======
const todoModal=document.getElementById("todoModal");
function openTodoModal(i){ editingTodo=i; document.getElementById("tdName").value=weekData.todos[i].text; todoModal.classList.add("show"); }
document.getElementById("tdCancel").onclick=()=>todoModal.classList.remove("show");
todoModal.onclick=e=>{ if(e.target===todoModal) todoModal.classList.remove("show"); };
document.getElementById("tdDel").onclick=()=>{ weekData.todos.splice(editingTodo,1); todoModal.classList.remove("show"); renderTodos(); queueSave(); };
document.getElementById("tdOk").onclick=()=>{ const v=document.getElementById("tdName").value.trim(); if(!v){ alert("Enter text or delete the task."); return; } weekData.todos[editingTodo].text=v; todoModal.classList.remove("show"); renderTodos(); queueSave(); };

// ====== LIST ITEM MODAL (supper / breakfast / any custom section) ======
let editingList=null; // {d,sid,idx}
const listModal=document.getElementById("listModal");
function openListModal(d,sid,idx){
  editingList={d,sid,idx};
  const sec=SECTIONS.find(s=>s.id===sid);
  document.getElementById("listModalTitle").textContent="Edit "+(sec?sec.label.toLowerCase():"item");
  document.getElementById("liName").value=weekData.days[d].lists[sid][idx].name;
  listModal.classList.add("show");
}
document.getElementById("liCancel").onclick=()=>listModal.classList.remove("show");
listModal.onclick=e=>{ if(e.target===listModal) listModal.classList.remove("show"); };
document.getElementById("liDel").onclick=()=>{
  const {d,sid,idx}=editingList;
  weekData.days[d].lists[sid].splice(idx,1);
  listModal.classList.remove("show"); renderDays(); queueSave();
};
document.getElementById("liOk").onclick=()=>{
  const v=document.getElementById("liName").value.trim(); if(!v){ alert("Enter a name or delete it."); return; }
  const {d,sid,idx}=editingList;
  weekData.days[d].lists[sid][idx].name=v;
  listModal.classList.remove("show"); renderDays(); queueSave();
};

// ====== SETTINGS SCREEN ======
document.getElementById("settingsBack").onclick=()=>openMonth();
function renderSettings(){
  const ul=document.getElementById("userList"); ul.innerHTML="";
  USERS.forEach(u=>{
    const row=document.createElement("div"); row.className="settings-row";
    row.innerHTML=`<span class="handle-badge">${escapeHtml(HANDLES[u.id]||"?")}</span>
      <input type="text" class="inp" value="${escapeAttr(u.name)}" data-uid="${u.id}" autocomplete="off">
      <button class="iconb-del" data-deluser="${u.id}" ${USERS.length<=1?"disabled":""}>✕</button>`;
    ul.appendChild(row);
  });
  const sl=document.getElementById("sectionList"); sl.innerHTML="";
  SECTIONS.forEach(s=>{
    const row=document.createElement("div"); row.className="settings-row";
    row.innerHTML=`<input type="text" class="inp" value="${escapeAttr(s.label)}" data-sid="${s.id}" autocomplete="off">
      <button class="iconb-del" data-delsec="${s.id}" ${SECTIONS.length<=1?"disabled":""}>✕</button>`;
    sl.appendChild(row);
  });
  bindSettings();
}
function bindSettings(){
  document.querySelectorAll("#userList input[data-uid]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const v=inp.value.trim(); if(!v) return;
      const u=USERS.find(x=>x.id===inp.dataset.uid); if(u){ u.name=v; saveUsers(); }
    });
  });
  document.querySelectorAll("[data-deluser]").forEach(b=>b.onclick=()=>{
    if(USERS.length<=1) return;
    if(!confirm("Remove this person?")) return;
    USERS=USERS.filter(u=>u.id!==b.dataset.deluser); saveUsers();
  });
  document.querySelectorAll("#sectionList input[data-sid]").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const v=inp.value.trim(); if(!v) return;
      const s=SECTIONS.find(x=>x.id===inp.dataset.sid); if(s){ s.label=v; saveSections(); }
    });
  });
  document.querySelectorAll("[data-delsec]").forEach(b=>b.onclick=()=>{
    if(SECTIONS.length<=1) return;
    if(!confirm("Remove this section? Existing entries under it are hidden, not deleted.")) return;
    SECTIONS=SECTIONS.filter(s=>s.id!==b.dataset.delsec); saveSections();
  });
}
document.getElementById("userAddInput").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const v=e.target.value.trim(); if(!v) return;
  USERS.push({id:genId("u"),name:v}); e.target.value=""; saveUsers();
});
document.getElementById("sectionAddInput").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const v=e.target.value.trim(); if(!v) return;
  SECTIONS.push({id:genId("sec"),label:v}); e.target.value=""; saveSections();
});

// ====== AUTO REFRESH ======
// Week screen stays live via the onValue subscription; only the month
// screen's counts need a manual refresh on refocus.
function maybeAutoRefresh(){
  if(Date.now()-lastRefresh<3000) return;
  lastRefresh=Date.now();
  if(document.getElementById("month").classList.contains("active")) loadMonthCounts();
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) maybeAutoRefresh(); });
window.addEventListener("focus",maybeAutoRefresh);

// ====== UTIL ======
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return (s||"").replace(/"/g,'&quot;');}

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
